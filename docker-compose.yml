
x-superset-image: &superset-image apachesuperset.docker.scarf.sh/apache/superset:${TAG:-latest}
x-superset-depends-on: &superset-depends-on
  - db
  - redis
x-superset-volumes:
  &superset-volumes # /app/pythonpath_docker will be appended to the PYTHONPATH in the final container
  - ./docker:/app/docker
  - ./docker/assets:/app/superset/static/jb_assets
  - superset_home:/app/superset_home
  - ./superset:/app/superset

services:
  redis:
    image: redis:7
    container_name: superset_cache
    restart: unless-stopped
    volumes:
      - redis:/data

  db:
    env_file:
      - path: docker/.env # default
        required: true
      - path: docker/.env-local # optional override
        required: false
    image: postgres:15
    container_name: superset_db
    restart: unless-stopped
    volumes:
      - db_home:/var/lib/postgresql/data
      - ./docker/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d

  trino:
    container_name: trino
    image: trinodb/trino:latest
    restart: unless-stopped
    env_file:
      - path: docker/.env # default
        required: true
      - path: docker/.env-local # optional override
        required: false
    ports:
      - "8050:8080" 
    volumes:
      - ./etc-trino:/etc/trino

  # trino-init:
  #   container_name: trino_init
  #   image: trinodb/trino:latest
  #   depends_on:
  #     - trino
  #     - hivemetastore
  #   entrypoint: ["/bin/sh", "-c"]
  #   command: 
  #     - sh
  #     - -c
  #     - |
  #       # Wait for Trino to be ready (after healthcheck)
  #       until trino --server trino:8080 --execute "SELECT 1" >/dev/null 2>&1; do
  #         echo "Waiting for Trino to be ready..."
  #         sleep 2
  #       done
  #       # Execute SQL script
  #       echo "Initializing Trino..."
  #       trino --server trino:8080 -f /etc/trino/init.sql
  #   volumes:
  #     - ./etc-trino:/etc/trino
  #   env_file:
  #     - path: docker/.env
  #       required: true
  #     - path: docker/.env-local
  #       required: false

  metastore-db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: metastore
    volumes:
      - hive-metastore-db:/var/lib/mysql

  # Hive Metastore service
  hive-metastore:
    image: apache/hive:3.1.3
    depends_on:
      - metastore-db
    environment:
      HIVE_METASTORE_DB_TYPE: mysql
      HIVE_METASTORE_HOST: metastore-db
      HIVE_METASTORE_PORT: 3306
      HIVE_METASTORE_DB_NAME: metastore
      HIVE_METASTORE_USERNAME: root
      HIVE_METASTORE_PASSWORD: secret
      # warehouse dir for your tables/views
      HIVE_METASTORE_WAREHOUSE_DIR: /user/hive/warehouse
    # Explicitly start the metastore service (instead of the default CLI)
    command: ["hive", "--service", "metastore"]
    ports:
      - "9083:9083"
    healthcheck:
      test: ["CMD", "nc", "-vz", "0.0.0.0", "9083"]
      interval: 10s
      retries: 5
      
  superset:
    env_file:
      - path: docker/.env # default
        required: true
      - path: docker/.env-local # optional override
        required: false
    image: *superset-image
    container_name: superset_app
    command: ["/app/docker/docker-bootstrap.sh", "app-gunicorn"]
    user: "root"
    restart: unless-stopped
    ports:
      - 8088:8088
    depends_on: *superset-depends-on
    volumes: *superset-volumes

  superset-init:
    image: *superset-image
    container_name: superset_init
    command: ["/app/docker/docker-init.sh"]
    env_file:
      - path: docker/.env # default
        required: true
      - path: docker/.env-local # optional override
        required: false
    depends_on: *superset-depends-on
    user: "root"
    volumes: *superset-volumes
    healthcheck:
      disable: true

  superset-worker:
    image: *superset-image
    container_name: superset_worker
    command: ["/app/docker/docker-bootstrap.sh", "worker"]
    env_file:
      - path: docker/.env # default
        required: true
      - path: docker/.env-local # optional override
        required: false
    restart: unless-stopped
    depends_on: *superset-depends-on
    user: "root"
    volumes: *superset-volumes
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A superset.tasks.celery_app:app inspect ping -d celery@$$HOSTNAME",
        ]

  superset-worker-beat:
    image: *superset-image
    container_name: superset_worker_beat
    command: ["/app/docker/docker-bootstrap.sh", "beat"]
    env_file:
      - path: docker/.env # default
        required: true
      - path: docker/.env-local # optional override
        required: false
    restart: unless-stopped
    depends_on: *superset-depends-on
    user: "root"
    volumes: *superset-volumes
    healthcheck:
      disable: true

volumes:
  superset_home:
    external: false
  db_home:
    external: false
  redis:
    external: false
  hive-metastore-db:
    external: false